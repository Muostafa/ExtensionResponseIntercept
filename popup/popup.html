<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Response Interceptor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔧 API Response Interceptor</h1>
    </header>

    <section class="status-section">
      <div class="status-item">
        <label>Global Interception</label>
        <div class="toggle-switch">
          <input type="checkbox" id="globalToggle" class="toggle-input">
          <label for="globalToggle" class="toggle-label"></label>
        </div>
      </div>

      <div class="status-item">
        <label>Current Tab</label>
        <button id="attachTab" class="btn btn-primary">Attach Debugger</button>
      </div>
    </section>

    <section class="rules-section">
      <div class="section-header">
        <h2>Active Rules</h2>
        <span id="rulesCount" class="badge">0</span>
      </div>

      <div style="margin-bottom: 12px; padding: 8px; background: #f5f5f5; border-radius: 4px;">
        <div style="display: flex; flex-direction: column; gap: 8px; font-size: 12px;">
          <div style="display: flex; gap: 8px; align-items: center;">
            <label for="popupSortBy" style="font-weight: 500; white-space: nowrap;">Sort:</label>
            <select id="popupSortBy" class="form-control" style="flex: 1; font-size: 12px; padding: 4px;">
              <option value="modified">Last Modified</option>
              <option value="created">Date Created</option>
              <option value="name">Name</option>
            </select>
            <select id="popupSortOrder" class="form-control" style="width: 90px; font-size: 12px; padding: 4px;">
              <option value="desc">Newest</option>
              <option value="asc">Oldest</option>
            </select>
          </div>
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="popupEnabledRulesFirst" checked>
            <span>Show enabled rules first</span>
          </label>
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="popupHideDisabledGroupRules" checked>
            <span>Hide rules from disabled groups</span>
          </label>
        </div>
      </div>

      <div id="rulesList" class="rules-list">
        <!-- Rules will be populated here -->
      </div>

      <button id="addRuleBtn" class="btn btn-secondary">+ Add New Rule</button>
    </section>

    <section class="actions-section">
      <button id="openHistory" class="btn btn-link">📊 View History</button>
      <button id="openOptions" class="btn btn-link">⚙️ Open Settings</button>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
